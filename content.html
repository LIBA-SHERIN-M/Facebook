<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Page Isn't Available</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: #333333;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Main white screen */
        .container {
            position: relative;

            width: calc(100% - 6px);
            height: calc(100vh - 7px);
            height: calc(100dvh - 7px);

            margin: 3px;

            background: #ffffff;

            border-radius: 5px;

            overflow: hidden;
        }

        /* =====================================
           CENTER CONTENT
        ===================================== */

        .content {
            position: absolute;

            top: 50%;
            left: 10px;
            right: 10px;

            transform: translateY(-50%);

            width: calc(100% - 20px);
        }

        /* =====================================
           ERROR ICON
        ===================================== */

        .error-icon {
            width: 48px;
            height: 48px;

            border: 1.5px solid #606770;
            border-radius: 50%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            margin-bottom: 7px;
        }

        .exclamation-bar {
            width: 5px;
            height: 19px;

            border: 1.5px solid #606770;
            border-radius: 5px;

            margin-bottom: 3px;
        }

        .exclamation-dot {
            width: 6px;
            height: 6px;

            border: 1.5px solid #606770;
            border-radius: 50%;
        }

        /* =====================================
           TITLE
        ===================================== */

        .title {
            width: 100%;

            margin: 0 0 10px 0;

            font-size: 16px;
            line-height: 19px;
            font-weight: 400;

            color: #050505;
        }

        /* =====================================
           DESCRIPTION
        ===================================== */

        .description {
            width: 100%;

            margin: 0;

            font-size: 12px;
            line-height: 14px;
            font-weight: 400;

            color: #1c1e21;
        }

        /* =====================================
           REFRESH BUTTON
        ===================================== */

        .refresh-button {
            position: absolute;

            left: 7px;
            right: 7px;
            bottom: 16px;

            width: calc(100% - 14px);
            height: 32px;

            padding: 0;

            border: none;
            border-radius: 18px;

            background: #1877f2;

            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 400;

            cursor: pointer;
        }

        .refresh-button:active {
            transform: scale(0.99);
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media screen and (max-width: 480px) {

            .content {
                left: 10px;
                right: 10px;
                width: calc(100% - 20px);
            }

            .title {
                font-size: 16px;
                line-height: 19px;
            }

            .description {
                font-size: 12px;
                line-height: 14px;
            }
        }


        /* =====================================
           SMALL PHONES
        ===================================== */

        @media screen and (max-width: 320px) {

            .content {
                left: 8px;
                right: 8px;
                width: calc(100% - 16px);
            }

            .title {
                font-size: 15px;
                line-height: 18px;
            }

            .description {
                font-size: 11px;
                line-height: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="content">

            <!-- Error icon -->
            <div class="error-icon">
                <div class="exclamation-bar"></div>
                <div class="exclamation-dot"></div>
            </div>

            <!-- Title -->
            <h1 class="title">
                Page isn't available right now
            </h1>

            <!-- Description -->
            <p class="description">
                This may be because of a technical error that we're
                working to get fixed. Try reloading this page.
            </p>

        </div>

        <!-- Refresh button -->
        <button class="refresh-button" onclick="location.reload();">
            REFRESH
        </button>

    </div>

</body>

</html>
